# curator — openrouter set. Deliberate model: this is judgement about what
# is worth keeping, not mechanical triage.
name: curator
inherits: [_base_curator]
plugins: []          # empty keeps the inherited _base surface
model: anthropic/claude-sonnet-5
provider: openrouter
plugin_configs:
  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    api_params:
      # Lower than either half. Curation is a judgement that should be
      # repeatable; the wandering belongs upstream of it.
      temperature: 0.3
      max_tokens: 2500
