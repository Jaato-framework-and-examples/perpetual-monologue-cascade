# curator — openrouter set. Deliberate model: this is judgement about what
# is worth keeping, not mechanical triage.
name: curator
inherits: [_base_curator]
plugins: []          # empty keeps the inherited _base surface
model: anthropic/claude-sonnet-5
provider: openrouter
plugin_configs:
  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    api_params:
      # Lower than either half. Curation is a judgement that should be
      # repeatable; the wandering belongs upstream of it.
      temperature: 0.3
      # Insurance for the BATCH, not licence for the queue. The bound
      # that matters is `limit=8` in the persona — a ceiling only moves
      # the cliff, it does not stop a queue read whole from spending the
      # whole waking on reading. Raised from 2500 because a truncated
      # curator decides nothing and the queue then grows faster, which is
      # the feedback loop this pair of changes exists to break.
      max_tokens: 4000
