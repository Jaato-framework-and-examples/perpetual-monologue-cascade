# subconscient — openrouter set. The associative half: faster, cheaper.
name: subconscient
inherits: [_base_subconscient]
plugins: []          # empty keeps the inherited _base surface
model: anthropic/claude-haiku-4.5
provider: openrouter
plugin_configs:
  openrouter:
    api_key: "${JAATO_OPENROUTER_API_KEY}"
    api_params:
      # Higher than the conscient's. The associative half's whole job is
      # the angle that was not taken; it is the half that should wander.
      temperature: 1.0
      # At 600 an association reaching for the memory tool was truncated
      # mid-sentence (run 12). A fragment that arrives looking complete is
      # worse than a short one.
      max_tokens: 1500
