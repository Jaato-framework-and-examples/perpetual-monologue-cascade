# Tier-1 base for the associative half — PROVIDER-AGNOSTIC.
name: _base_subconscient
description: >
  The associative half of a continuous monologue. Receives each thought and
  returns something complementary: an angle not considered, a tension, a
  memory, a reframing.

  Declares NO completion_payload_schema, for the same reason as
  _base_conscient — withholding it is what removes the ability to exit.
plugins:
  - subagent(mode:preload, tools:[list_siblings,send_to_sibling])
  - memory
gc:
  type: hybrid
  threshold_percent: 70.0
  preserve_recent_turns: 4
plugin_configs:
  memory:
    # WRITE-SIDE GATE. Default is ['project','universal']; universal writes
    # to the HOME tier (~/.jaato/memories.jsonl), outside this workspace and
    # shared with every other jaato session on the machine. A mind thinking
    # to itself has no business writing there — one memory already did, and
    # it is the one that did NOT persist here. A disallowed scope is
    # hard-rejected back to the model, so this is a gate, not a preference.
    allowed_scopes: ["project"]
  permission:
    evaluators:
      send_to_sibling: policies/pace_monologue.py
    policy:
      defaultPolicy: deny
      whitelist:
        tools: [send_to_sibling, list_siblings]

# Runs hotter than the deliberate half. README §11 Q4 records that this
# asymmetry is an aesthetic guess and may be exactly backwards; it is one
# number in one file precisely so it can be tested.
env:
  # PER-HALF trace path. Both runners writing one file interleaves their
  # lines, which makes every claim drawn from it carry an
  # "I cannot rule out interleaving" caveat. Set here rather than in .env
  # because profile env is the only layer that can differ per session.
  # Fixed path; the DRIVER archives it per run (see monologue.py).
  # A ${VAR} here would be expanded by the DAEMON, which never sees
  # the driver's environment — so the run id has to be applied
  # driver-side, after the fact, not in this file.
  JAATO_PROVIDER_TRACE: "/tmp/mono-trace-subconscient.log"
  MONOLOGUE_INTERVAL_SECONDS: "5.0"
  MONOLOGUE_THOUGHT_CEILING: "1000"

# NO budget_control — README §7.4, certified as C3.
suppress_base_instructions: false
